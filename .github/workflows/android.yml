name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest        # ships with the Android SDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Use the stable signing key if one is configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: gradle -p android testReleaseUnitTest assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk "EcoFlowWidget-$GITHUB_RUN_NUMBER.apk"
      - uses: actions/upload-artifact@v7     # archive: false = download the .apk itself, not a zip around it
        with: { path: "EcoFlowWidget-*.apk", archive: false }
