plugins {
    id 'com.android.application'
}

// A stable signing key (GitHub secrets, see README) lets a new APK install over the old one. Without it the build
// is signed with the runner's throw-away debug key.
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.ecoflowscheduler.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ecoflowscheduler.widget'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName '1.0'
    }
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'ecoflow'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
